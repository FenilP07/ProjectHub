spring:
  application:
    name: projecthub

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/projecthub}
    username: ${DB_USERNAME:projecthub_user}
    password: ${DB_PASSWORD:projecthub_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info

  endpoint:
    health:
      show-details: never

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [requestId=%X{requestId:-}] %logger{36} - %msg%n"

  level:
    root: INFO
    com.fenil.projecthub: DEBUG